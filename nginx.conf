# nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Add these lines for logging to stdout/stderr
    access_log /dev/stdout;
    error_log /dev/stderr;

    # HTTP server block: Redirects all HTTP traffic to HTTPS
    server {
        listen 8081;
        server_name japaneseapp.ignorelist.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server block: Serves your application
    server {
        listen 8444 ssl;
        server_name japaneseriddle.ignorelist.com;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://web:8012;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header Charset;
        }
    }
}
